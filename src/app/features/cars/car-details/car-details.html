<h2>Car Details</h2>

<p> Car Id is {{id()}}</p>

@let s = state();
@if (s.status === 'loading') {
  <p>Loading car details...</p>
} @else if (s.status === 'error') {
  <p >{{ s.message }}</p>
} @else {
  <h2>{{ s.data.make }} {{ s.data.model }}</h2>
  @if (s.data.year) {
    <p>Year: {{ s.data.year }}</p>
  }
}
